# TorgAtlas self-hosted Umami v3 (site analytics). Isolated from Cloud: own DB, own networks, no shared volumes.
# Secrets live ONLY in the server env file (UMAMI_ENV_FILE), never in Git.
# Images are pinned by digest (Umami 3.4.0 postgresql build; PostgreSQL 16.15 alpine).
name: torgatlas-umami

services:
  umami-db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    env_file: ${UMAMI_ENV_FILE:-../config/umami.env}
    environment:
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ${UMAMI_DATA_DIR:-../data}/postgres:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  umami:
    image: ghcr.io/umami-software/umami@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    restart: unless-stopped
    init: true
    env_file: ${UMAMI_ENV_FILE:-../config/umami.env}
    environment:
      TZ: UTC
    depends_on:
      umami-db: {condition: service_healthy}
    ports:
      - "127.0.0.1:${UMAMI_HOST_PORT:-19120}:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/heartbeat >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

networks:
  internal:
    internal: true
  edge: {}
