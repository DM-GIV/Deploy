# Standalone admin service for admin.torgatlas.ru. No Cloud/Core/PostgreSQL integration, no shared network.
# Lead DB is mounted READ-ONLY; the admin's own DB lives in a separate directory. Published on loopback only.
# export ADMIN_UID=$(id -u) ADMIN_GID=$(id -g)
services:
  torgatlas-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: torgatlas-admin:local
    container_name: torgatlas-admin
    restart: unless-stopped
    user: "${ADMIN_UID:?export ADMIN_UID=$(id -u)}:${ADMIN_GID:?export ADMIN_GID=$(id -g)}"
    env_file:
      - ${ADMIN_ENV_FILE:?absolute path to restricted admin.env (0600)}
    ports:
      - "127.0.0.1:18083:8082"
    volumes:
      - ${LEADS_DATA_HOST_DIR:?lead-intake data dir}:/leads:ro
      - ${ADMIN_DATA_HOST_DIR:?admin private data dir}:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
