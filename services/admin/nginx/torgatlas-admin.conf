# Add to /home/deploy/torgatlas-ops/nginx/torgatlas.d/ (picked up by nginx.conf `include torgatlas.d/*.conf`) AFTER the certificate exists.
# Separate server blocks: torgatlas.ru, www and (future) app are untouched. Requires /etc/letsencrypt/live/admin.torgatlas.ru/*.pem.
limit_req_zone $binary_remote_addr zone=ta_admin_login:2m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.torgatlas.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://admin.torgatlas.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.torgatlas.ru;
    ssl_certificate     /etc/letsencrypt/live/admin.torgatlas.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.torgatlas.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 8k;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /robots.txt { default_type text/plain; add_header X-Robots-Tag "noindex" always; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /login {
        limit_req zone=ta_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18083;
        include /etc/nginx/torgatlas.d/admin-proxy.inc;
    }
    location / {
        proxy_pass http://127.0.0.1:18083;
        include /etc/nginx/torgatlas.d/admin-proxy.inc;
    }
}
