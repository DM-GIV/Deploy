# http{} scope (loaded via torgatlas.d/*.conf). Per-IP: 2 requests/min, 1 concurrent; global: 4 concurrent.
limit_req_zone $binary_remote_addr zone=torgatlas_ai_search:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=torgatlas_ai_conn:10m;
limit_conn_zone $server_name zone=torgatlas_ai_global:1m;
