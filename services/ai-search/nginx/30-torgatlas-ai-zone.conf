# http{} scope (loaded via torgatlas.d/*.conf). Searches (POST) are limited per IP to 2 requests/min + burst 2 and
# 1 concurrent; GET status checks are cheap (no source access) and are not counted. Global cap: 4 concurrent.
map $request_method $torgatlas_ai_key { POST $binary_remote_addr; default ""; }
limit_req_zone $torgatlas_ai_key zone=torgatlas_ai_search:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=torgatlas_ai_conn:10m;
limit_conn_zone $server_name zone=torgatlas_ai_global:1m;
